name: Build and Publish OTA Update Patch

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target Version to release (e.g. 1.0.2)'
        required: true
        default: '1.0.2'
      release_notes:
        description: 'Release summary notes'
        required: false
        default: 'आधिकारिक OTA अपडेट व प्रदर्शन सुधार'

permissions:
  contents: write

jobs:
  build-and-release-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.target_version }}"
            NOTES="${{ github.event.inputs.release_notes }}"
          else
            VER="${GITHUB_REF_NAME#v}"
            NOTES="आधिकारिक OTA रिलीज v${VER}"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "notes=${NOTES}" >> $GITHUB_OUTPUT

      - name: Build OTA Patch Zip & Update Manifest
        run: |
          python scripts/publish_update.py --version ${{ steps.get_version.outputs.version }} --notes "${{ steps.get_version.outputs.notes }}"

      - name: Commit Updated version.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add version.json
          git commit -m "Auto-bump manifest to v${{ steps.get_version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || git push origin HEAD:main || true

      - name: Create GitHub Release and Upload update-patch.zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "UP Voter Seva v${{ steps.get_version.outputs.version }}"
          body: |
            ### UP वोटर सेवा आधिकारिक OTA अपडेट (v${{ steps.get_version.outputs.version }})
            
            - **रिलीज दिनांक:** $(date +'%Y-%m-%d')
            - **पैच प्रकार:** हॉट-पैच (Code & UI Patch)
            - **नोट्स:** ${{ steps.get_version.outputs.notes }}
            
            > **डेटा सुरक्षा:** इस अपडेट से मौजूदा मतदाता डेटाबेस (voters.db) और लाइसेंस कुंजी पूरी तरह सुरक्षित रहेंगे।
          files: |
            dist_output/update-patch.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
